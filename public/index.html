<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Financial Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page-wrap">
  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="overview" role="tab">Overview</button>
    <button class="tab" data-tab="paycheck" role="tab">Paycheck flow</button>
    <button class="tab" data-tab="spending" role="tab">Spending</button>
  </nav>

  <!-- ============ OVERVIEW ============ -->
  <section id="tab-overview" class="tab-panel active">
    <div class="net-hero">
      <div class="section-label">Net worth</div>
      <div class="net-number" id="nw-total">$0</div>
      <div class="net-stats">
        <div class="net-stat"><span class="k">Cash</span><span class="v" id="nw-cash">$0</span></div>
        <div class="net-stat"><span class="k">Investments</span><span class="v" id="nw-invest">$0</span></div>
        <div class="net-stat"><span class="k">Credit cards</span><span class="v neg" id="nw-debt">$0</span></div>
      </div>
      <div class="allocation" id="allocation"></div>
    </div>

    <div class="section-label">Accounts by institution</div>
    <div id="accounts"></div>

    <div class="section-label">Net worth over time</div>
    <div class="chart-card"><svg id="nw-chart" viewBox="0 0 720 240" role="img" aria-label="Net worth trend"></svg></div>
  </section>

  <!-- ============ PAYCHECK FLOW ============ -->
  <section id="tab-paycheck" class="tab-panel">
    <div class="section-label">Paycheck flow</div>
    <div class="flow-sheet" id="flow"></div>

    <div class="section-label">Recurring payments</div>
    <div class="card"><ul class="line-list" id="recurring-paycheck"></ul></div>
  </section>

  <!-- ============ SPENDING ============ -->
  <section id="tab-spending" class="tab-panel">
    <div class="spend-head">
      <div>
        <div class="section-label">Net spend</div>
        <div class="spend-total"><span id="spend-net">$0</span> <span class="spend-of">/ <span id="spend-budget">$0</span></span></div>
      </div>
      <label class="month-picker">Month
        <select id="month-select"></select>
      </label>
    </div>

    <div class="budget-grid" id="budget-bars"></div>

    <div class="section-label">Transactions</div>
    <div id="tx-list"></div>

    <div class="section-label">Owed to you</div>
    <div class="card"><ul class="line-list" id="owed-list"></ul></div>

    <div class="section-label">Recurring payments</div>
    <div class="card"><ul class="line-list" id="recurring-spending"></ul></div>
  </section>
</div>

<div class="menu hidden" id="row-menu">
  <button data-action="share">Set share</button>
  <button data-action="ignore">Ignore</button>
  <button data-action="include">Include in totals</button>
</div>

<script src="app.js"></script>
</body>
</html>
